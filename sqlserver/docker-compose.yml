services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "Ron@ld1234"
      ACCEPT_EULA: "Y"
    restart: unless-stopped # Reinicia siempre, excepto si tú lo detuviste manualmente.
    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data:
