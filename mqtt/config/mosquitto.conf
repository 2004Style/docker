# Configuracion basica de Eclipse Mosquitto para desarrollo local.
# Para produccion, configura usuarios/passwords, ACLs y TLS.

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

allow_anonymous true
listener 1883 0.0.0.0
