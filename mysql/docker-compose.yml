services:
  mysql:
    image: mysql:8.4
    container_name: mysql-server
    restart: unless-stopped # Reinicia siempre, excepto si tú lo detuviste manualmente.
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pruebas
      MYSQL_USER: rdev
      MYSQL_PASSWORD: rdev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
