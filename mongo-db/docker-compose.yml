services:
  mongodb:
    image: mongo:latest
    container_name: mongo-server
    restart: unless-stopped # Reinicia siempre, excepto si tú lo detuviste manualmente.
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: rdev
      MONGO_INITDB_ROOT_PASSWORD: rdev
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
